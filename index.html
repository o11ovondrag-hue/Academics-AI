<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia AI Pro</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Библиотека для парсинга PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Библиотека для парсинга DOCX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <span class="logo-icon">🎓</span>
          <div class="logo-text">
            <h2>Academia AI</h2>
            <span class="version-tag">LLM-Powered v3.0</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button type="button" class="nav-btn active" data-target="analysis-section">
            <span class="nav-icon">🔍</span>
            <span>Анализ источников</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        <p>Академический ИИ-Ассистент</p>
      </div>
    </aside>

    <main class="main-content">
      <section id="analysis-section" class="app-section">
        <div class="section-header">
          <h1>Комплексный Академический Анализ Источника</h1>
          <p>Глубокая 8-уровневая критическая экспертиза на базе Gemini AI</p>
        </div>

        <div class="card form-card">
          <div class="form-group full-width">
            <label>Загрузка документа или файла</label>
            <div id="drop-zone" class="drop-zone">
              <span class="drop-zone-icon">📁</span>
              <p class="drop-zone-text">Перетащите файл сюда или <span class="browse-btn">выберите на компьютере</span></p>
              <p class="drop-zone-subtext">Поддерживаются PDF, TXT, DOCX</p>
              <input type="file" id="file-input" accept=".pdf,.txt,.docx,.doc" class="file-input-hidden">
            </div>
            <div id="file-info" class="file-info hidden">
              <span class="file-icon">📄</span>
              <span id="file-name" class="file-name">filename.pdf</span>
              <button type="button" id="remove-file-btn" class="remove-file-btn" title="Удалить файл">✕</button>
            </div>
          </div>

          <div class="form-group full-width">
            <label for="source-title">Название материала / Библиографическое описание</label>
            <input type="text" id="source-title" placeholder="например, China's Middle East Economic Diplomacy">
          </div>

          <div class="form-group full-width">
            <label for="source-text">Текст, выдержка или извлеченный контент</label>
            <textarea id="source-text" rows="8" placeholder="Текст из файла появится здесь автоматически..."></textarea>
          </div>

          <button type="button" id="analyze-source-btn" class="btn btn-primary">
            <span id="btn-text">🔍 Провести 8-уровневый разбор (Gemini AI)</span>
          </button>
        </div>

        <div id="analysis-results-container"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
